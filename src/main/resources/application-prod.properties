# ── Production profile — Railway deployment ───────────────────────────────────
# Railway provides MySQL as: MYSQL_URL (full JDBC URL), MYSQL_USER, MYSQL_PASSWORD
# OR as separate vars: MYSQLHOST, MYSQLPORT, MYSQLDATABASE, MYSQLUSER, MYSQLPASSWORD
# Both formats are supported below.

# Option 1: Railway MySQL plugin (auto-provided)
spring.datasource.url=${MYSQL_URL:${DB_URL:jdbc:mysql://localhost:3306/hk?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}}
spring.datasource.username=${MYSQL_USER:${DB_USERNAME:root}}
spring.datasource.password=${MYSQL_PASSWORD:${DB_PASSWORD:manager}}

# JWT — MUST set JWT_SECRET env var on Railway (min 32 chars)
app.jwt.secret=${JWT_SECRET:hkpg_change_this_in_production_min_32_chars}
app.jwt.expiration-ms=86400000

# CORS — set ALLOWED_ORIGINS to your Vercel URL on Railway
app.cors.allowed-origins=${ALLOWED_ORIGINS:https://hk-pg-frontend.vercel.app}

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:dzr0crkvr}
cloudinary.api-key=${CLOUDINARY_API_KEY:366447514547635}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:IUdHiXU8H3Uu3Z-l2JyJLa9hueY}

# Upload dir — Railway uses ephemeral filesystem, Cloudinary is primary
app.upload.dir=/tmp/uploads

# Logging — minimal in production
logging.level.com.example.hk=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
spring.jpa.show-sql=false

# Error handling — never expose internals
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
