# ── Production profile ────────────────────────────────────────────────────────
# Backend: Render.com
# Database: Railway MySQL
# Set all these as Environment Variables on Render dashboard

# ─── MySQL (Railway) ──────────────────────────────────────────────────────────
# Railway provides a full JDBC URL — set it as DB_URL on Render
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ─── JPA ──────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ─── JWT ──────────────────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# ─── CORS ─────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=${ALLOWED_ORIGINS}

# ─── Cloudinary ───────────────────────────────────────────────────────────────
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# ─── Upload dir (Render ephemeral filesystem) ─────────────────────────────────
app.upload.dir=/tmp/uploads

# ─── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.example.hk=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
spring.jpa.show-sql=false

# ─── Error handling ───────────────────────────────────────────────────────────
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
