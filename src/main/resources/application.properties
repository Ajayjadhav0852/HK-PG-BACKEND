# ─── Server ───────────────────────────────────────────────────────────────────
spring.application.name=HK_Backend
server.port=${PORT:8080}

# ─── PostgreSQL (Supabase Session Pooler) ────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require&prepareThreshold=0}
spring.datasource.username=${DB_USERNAME:postgres.xygllkdhllaltysdbrhf}
spring.datasource.password=${DB_PASSWORD:Admin@ajay0852}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.initialization-fail-timeout=-1

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
# update: auto-creates/updates tables on startup
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# ─── JWT ──────────────────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:hkpg_super_secret_jwt_key_2024_change_in_production_min_256_bits}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ─── CORS ─────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ─── Cloudinary ───────────────────────────────────────────────────────────────
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:dzr0crkvr}
cloudinary.api-key=${CLOUDINARY_API_KEY:366447514547635}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:IUdHiXU8H3Uu3Z-l2JyJLa9hueY}

# ─── File Upload ──────────────────────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=15MB
app.upload.dir=${UPLOAD_DIR:uploads}

# ─── Swagger / OpenAPI ────────────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.display-request-duration=true
springdoc.show-actuator=false
springdoc.default-produces-media-type=application/json

# ─── Email (Gmail SMTP) ───────────────────────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:hk.pg.akurdi@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.admin.email=${ADMIN_EMAIL:hk.pg.akurdi@gmail.com}
app.site.url=${SITE_URL:https://hk-pg-akurdi.vercel.app}
app.site.backend-url=${BACKEND_URL:https://hk-pg-backend.onrender.com}

# ─── Scheduling ───────────────────────────────────────────────────────────────
spring.task.scheduling.pool.size=2
logging.level.com.example.hk=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.com.zaxxer.hikari=WARN

# ─── Error handling ───────────────────────────────────────────────────────────
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
